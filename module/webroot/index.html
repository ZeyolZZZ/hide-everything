<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hide Everything</title>
<style>
 body{font-family:system-ui;margin:0;padding:16px;background:#faf8ff;color:#1b1b1f}
 h1{font-size:20px;margin:0 0 4px}.sub{color:#666;font-size:13px;margin-bottom:14px}
 .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
 input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc;width:100%;box-sizing:border-box}
 button{background:#6750a4;color:#fff;border:0;margin-top:8px}
 .app{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}
 .app:last-child{border-bottom:0}.tag{font-size:12px;color:#6750a4}
 .err{background:#fde7e9;color:#8c1d18;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px;white-space:pre-wrap}
 code{word-break:break-all;font-size:12px;color:#444}
</style></head><body>
<h1>Hide Everything</h1>
<div class="sub">按应用隐藏应用列表（目标应用仅见：系统基础组件 + 自身）</div>
<div id="err" class="err" style="display:none"></div>

<div class="card"><b>添加目标应用</b>
  <input id="pkg" placeholder="com.example.app　或　allow:com.xxx（白名单）">
  <button onclick="add()">添加</button>
</div>
<div class="card"><b>已配置</b><div id="list" class="sub">加载中…</div></div>
<div class="card"><b>状态</b><div id="stat" class="sub">加载中…</div></div>

<script>
const CFG='/data/adb/hide_everything/config.json';
function showErr(m){const e=document.getElementById('err');e.style.display='block';e.textContent='WebUI 桥错误: '+m;}
function set(id,v){document.getElementById(id).innerHTML=v;}

/* KernelSU WebUI 签名是 exec(cmd, options, callback)，三个参数缺一不可 */
function sh(cmd,cb){
  let done=false;
  const fire=(c,o)=>{if(done)return;done=true;cb(c,String(o==null?'':o));};
  const timer=setTimeout(()=>fire(-1,'(超时：桥无响应)'),8000);
  try{
    if(window.ksu&&typeof ksu.exec==='function'){ksu.exec(cmd,'{}',(c,o)=>{clearTimeout(timer);fire(c,o);});return;}
    if(window.KernelSU&&typeof KernelSU.exec==='function'){KernelSU.exec(cmd,'{}',(c,o)=>{clearTimeout(timer);fire(c,o);});return;}
    if(window.ksud&&typeof ksud.exec==='function'){ksud.exec(cmd,'{}',(c,o)=>{clearTimeout(timer);fire(c,o);});return;}
  }catch(e){clearTimeout(timer);fire(-1,String(e));return;}
  clearTimeout(timer);
  set('list','—');set('stat','—');
  showErr('未检测到 KernelSU WebUI 桥。请从 KSU 管理器的「模块」页面点本模块的 WebUI 打开，不要用浏览器直接访问。');
}
function load(){
  sh('cat '+CFG+' 2>/dev/null || echo []',(c,o)=>{
    if(c!==0&&!/[\[\{]/.test(o)){set('list','读取失败');return;}
    let arr=[];try{arr=JSON.parse(o||'[]')}catch(e){arr=(o||'').split(/\s+/).filter(Boolean)}
    set('list', arr.length? arr.map(p=>{
      const wl=p.startsWith('allow:');
      return '<div class="app"><span>'+(wl?p.slice(6):p)+'</span><span class="tag">'+(wl?'白名单':'隐藏目标')+'</span></div>';
    }).join('') : '（空）');
  });
  sh('(zcat /proc/config.gz 2>/dev/null | grep -q "^CONFIG_KSU_SUSFS_SUS_PATH=y" && echo SUSPATH_OK || echo SUSPATH_NO); (ls /data/adb/modules/hide_everything/disable >/dev/null 2>&1 && echo DISABLED || echo ENABLED)',(c,o)=>{
    set('stat','SUS_PATH 支持: '+(/SUSPATH_OK/.test(o)?'✅':'❌')+
        '<br>模块状态: '+(/DISABLED/.test(o)?'⛔ 已自动禁用（连续启动失败）':'✅ 正常')+
        '<br><code>'+CFG+'</code>');
  });
}
function add(){
  const v=document.getElementById('pkg').value.trim();if(!v)return;
  sh('cat '+CFG+' 2>/dev/null',(c,o)=>{
    let arr=[];try{arr=JSON.parse(o||'[]')}catch(e){arr=[]}
    if(arr.indexOf(v)<0)arr.push(v);
    const b64=btoa(JSON.stringify(arr));
    sh("mkdir -p /data/adb/hide_everything && echo '"+b64+"' | base64 -d > "+CFG+" && echo WROTE",(c2,o2)=>{
      if(/WROTE/.test(o2)){if(window.ksu&&ksu.toast)ksu.toast('已添加 '+v);document.getElementById('pkg').value='';load();}
      else showErr('写入失败: '+o2);
    });
  });
}
load();
</script></body></html>
